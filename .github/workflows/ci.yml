name: Testes e seguranca
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes funcionais e de validacao
        run: python -m unittest -v test_api.py
      - name: Instalar ferramentas de seguranca
        run: python -m pip install bandit pip-audit
      - name: SAST
        run: bandit app.py deploy/backup.py -ll
      - name: Auditar dependencias da implantacao
        run: pip-audit -r requirements.txt
      - name: Sintaxe de scripts Linux
        run: bash -n deploy/install.sh deploy/reload-nginx.sh
