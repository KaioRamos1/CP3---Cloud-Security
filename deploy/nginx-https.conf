limit_req_zone $binary_remote_addr zone=minhafrota:10m rate=10r/s;
log_format minhafrota_safe '$time_iso8601 $remote_addr $request_method $uri $status $request_time';
server {
    listen 80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log /var/log/nginx/minhafrota-access.log minhafrota_safe;
    error_log /var/log/nginx/minhafrota-error.log warn;
    location / {
        auth_basic "Minha Frota";
        auth_basic_user_file /etc/nginx/minhafrota.htpasswd;
        limit_req zone=minhafrota burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
